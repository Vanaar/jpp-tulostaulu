<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Junnut Pelaa Pesistä -tulostaulu</title>
    {% if style is not none %}
        <link rel='stylesheet' href='/static/css/scoreboard_{{style}}.css'>
    {% else %}
    <link rel='stylesheet' href='/static/css/scoreboard_default.css'>
    {% endif %}
</head>
<body>
<div id="tulostaulu"></div>

{% if debug == "on" %}
    <div id="pt_loader">Debug-moodi päällä</div>
{% else %}
    <div id="pt_loader" style="display: none"></div>
{% endif %}

<script>
    // Päivitysväli millisekunteina. Livedata haetaan pesistulokset-API:sta
    // palvelimen puolella ja välimuistitetaan, joten selaimet eivät kuormita
    // API:a katsojamäärän mukaan.
    var PAIVITYSVALI = {{ paivitysvali | default(5000) }};

    function fetchTulostaulu() {
        var ottelu_url = '/{{ottelu.ottelunumero}}/tulostaulu';
        if ("{{debug}}" === "on") {
            ottelu_url += "?debug=on";
        }

        fetch(ottelu_url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('tulostaulu').innerHTML = data;
            })
            .catch(error => console.error('Virhe tulostaulun noudossa:', error));
    }

    setInterval(fetchTulostaulu, PAIVITYSVALI);
    fetchTulostaulu();
</script>
</body>
</html>

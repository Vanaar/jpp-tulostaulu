<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Junnut Pelaa Pesistä -manuaalitaulu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <h1>Junnut Pelaa Pesistä &ndash; manuaalitaulu</h1>

    <p>Käsin päivitettävä tulostaulu. Pesistulokset-API:sta tulevat ottelut
    näkyvät suoraan osoitteessa <code>/&lt;ottelunumero&gt;</code> eivätkä
    tarvitse tätä sivua.</p>

    <a href="/uusi">Aloita uusi ottelu</a>

    <form id="updateForm" action="/paivita/" method="GET">
        <label for="ottelunumero">Syötä ottelunumero:</label>
        <input type="text" id="ottelunumero" name="ottelunumero">
        <button type="submit">Päivitä</button>
    </form>

    <script>
        document.getElementById('updateForm').addEventListener('submit', function(event) {
            event.preventDefault();
            var ottelunumero = document.getElementById('ottelunumero').value;
            window.location.href = "/paivita/" + encodeURIComponent(ottelunumero);
        });
    </script>

</body>
</html>
